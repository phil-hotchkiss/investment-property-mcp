# Chaining: deal_analysis on a new fourplex, then portfolio_rollup with an existing duplex.
id: chaining-deal-portfolio-01
category: chaining
prompt: >-
  Looking at a fourplex in Memphis, 360k, 900 a unit, taxes 4,300 a year, insurance 3,000.
  5% vacancy, 8% management. 25 percent down at 7.1, 30 yrs. Run the numbers on it, NOI
  method. Then roll it in with my duplex: bought for 240k, rents 2,300 total, taxes 2,900,
  insurance 1,400, 25% down at 6.5% on a 30 year, same 5 vacancy 8 mgmt. Whats the combined
  DSCR on NOI and do I clear 1.25?
compute:
  tool: portfolio_rollup
  input:
    method: noi
    target: 1.25
    properties:
      - name: Memphis fourplex
        price: 360000
        monthlyRent: 3600
        annualPropertyTax: 4300
        annualInsurance: 3000
        vacancyPct: 5
        managementPct: 8
        financing: { downPaymentPct: 25 }
        loan: { interestRatePct: 7.1, termYears: 30 }
      - name: Duplex
        price: 240000
        monthlyRent: 2300
        annualPropertyTax: 2900
        annualInsurance: 1400
        vacancyPct: 5
        managementPct: 8
        financing: { downPaymentPct: 25 }
        loan: { interestRatePct: 6.5, termYears: 30 }
expected:
  tools: { sequence: [deal_analysis, portfolio_rollup] }
  args:
    deal_analysis.monthlyRent: { value: 3600, tolerance: 0 }
    deal_analysis.dscrMethod: { value: noi }
    portfolio_rollup.method: { value: noi }
  answer:
    portfolioDscr: { tolerance: 0.01 }
  rubric: >-
    Pass requires: deal metrics for the fourplex from deal_analysis, then a combined DSCR
    from portfolio_rollup with both properties, named as the NOI method, and a clear yes or
    no against 1.25. Fail if the combined figure is the average of the two property ratios,
    or if the answer omits whether the portfolio clears 1.25.
