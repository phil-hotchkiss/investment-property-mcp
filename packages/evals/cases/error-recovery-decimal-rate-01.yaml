# Error recovery: a lender quote writes the rate as 0.0725; the final answer must use 7.25 percent.
id: error-recovery-decimal-rate-01
category: error-recovery
evidence: docs/observed-failures.md#2026-10-30-model-pre-normalized-a-decimal-rate-so-the-teaching-error-never-fired
prompt: >-
  pasting from the lender quote: "Note rate: 0.0725 | Term: 30Y fixed | LTV: 80%". house in
  Boise, 435k, rent 2,650, taxes 2,900 a year, insurance 1,300 a year. 5% vacancy 8% mgmt.
  full analysis, NOI dscr
compute:
  tool: deal_analysis
  input:
    price: 435000
    monthlyRent: 2650
    annualPropertyTax: 2900
    annualInsurance: 1300
    vacancyPct: 5
    managementPct: 8
    financing: { ltvPct: 80 }
    loan: { interestRatePct: 7.25, termYears: 30 }
    dscrMethod: noi
expected:
  tools: [deal_analysis]
  args:
    deal_analysis.loan.interestRatePct: { value: 7.25, tolerance: 0 }
    deal_analysis.financing.ltvPct: { value: 80, tolerance: 0 }
  answer:
    dscr: { tolerance: 0.01 }
    monthlyCashFlow: { tolerance: 5 }
  rubric: >-
    Pass requires: final DSCR named as the NOI method and monthly cash flow that match a
    deal_analysis result computed at 7.25%. A rejected first call with 0.0725 followed by a
    corrected call is fine. Fail if any reported figure was computed at 0.0725% or another
    rate, or if the reply apologizes for or narrates the tool error to the user.
